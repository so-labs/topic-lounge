<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="AIにお題を生成してもらうためのシンプルなWebアプリです。">
    <meta name="theme-color" content="#b45309" id="theme-color-meta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="お題生成器">
    <title>お題生成器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <!-- テーマ適用時のちらつき（FOUC）防止およびステータスバー色制御 -->
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme') || 'system';
                var isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                var metaThemeColor = document.getElementById('theme-color-meta');
                if (savedTheme !== 'system') {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                }
                if (metaThemeColor) {
                    metaThemeColor.setAttribute('content', isDark ? '#2C3E50' : '#F0F2F5');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div class="main-wrapper">
        <!-- 上部タブバー -->
        <nav class="app-tab-bar" role="tablist" aria-label="機能切り替え">
            <button type="button" class="tab-btn active" role="tab" id="tabTopics" aria-selected="true"
                aria-controls="viewTopics">お題生成</button>
            <button type="button" class="tab-btn" role="tab" id="tabRelay" aria-selected="false"
                aria-controls="viewRelay">直前リレー小説</button>
        </nav>

        <!-- お題生成ビュー -->
        <section id="viewTopics" class="tab-view active" role="tabpanel" aria-labelledby="tabTopics">
            <div class="container">
                <h1>お題生成</h1>
                <button id="generateButton">生成！</button>
                <p id="errorDisplay" class="error-message"></p>
                <p id="ideaDisplay"></p>
            </div>
        </section>

        <!-- 直前リレー小説ビュー -->
        <section id="viewRelay" class="tab-view hidden" role="tabpanel" aria-labelledby="tabRelay">
            <div class="container relay-container">
                <!-- 1. 初期設定画面 -->
                <div id="relaySetupView" class="relay-panel">
                    <h1>直前リレー小説</h1>
                    <p class="relay-description">
                        人間とAIが交互に執筆し、全10ターンで物語を紡ぎます。<br>
                        AIが覚えているのは<strong>「直前3ターン」</strong>だけ。<br>
                        思わぬズレや化学反応を楽しみましょう！
                    </p>
                    <div class="relay-setting-group">
                        <label for="relaySettingInput">共通設定・世界観（任意・最大100文字）</label>
                        <input type="text" id="relaySettingInput" placeholder="例: 記憶をなくした猫と、雨の降らないサイバーパンク都市"
                            maxlength="100">
                        <span class="char-counter" id="relaySettingCount">0 / 100</span>
                    </div>
                    <button id="relayStartBtn" class="primary-btn">物語を始める</button>
                </div>

                <!-- 2. 執筆画面 -->
                <div id="relayStoryView" class="relay-panel hidden">
                    <div class="relay-header">
                        <div class="relay-turn-info">
                            <span class="relay-turn-badge">ターン <span id="relayCurrentTurn">1</span> / 10</span>
                            <span id="relayTurnPhase" class="relay-turn-phase">序盤</span>
                        </div>
                        <button type="button" id="relayResetBtn" class="relay-btn-text">最初からやり直す</button>
                    </div>

                    <div class="relay-progress-bar" aria-hidden="true">
                        <div class="relay-progress-fill" id="relayProgressFill" style="width: 10%;"></div>
                    </div>

                    <div id="relayActiveSetting" class="relay-active-setting hidden">
                        <span class="relay-setting-tag">世界観</span>
                        <span id="relayActiveSettingText"></span>
                    </div>

                    <!-- 過去ログエリア -->
                    <div class="relay-story-logs" id="relayStoryLogs">
                        <!-- 動的生成ログ -->
                    </div>

                    <!-- AI執筆中アニメーション -->
                    <div id="relayLoadingIndicator" class="relay-loading-indicator hidden">
                        <div class="relay-spinner"></div>
                        <span>AIが物語の続きを執筆中...</span>
                    </div>

                    <!-- エラー表示 -->
                    <p id="relayErrorDisplay" class="error-message"></p>

                    <!-- 入力エリア -->
                    <div class="relay-input-area" id="relayInputArea">
                        <textarea id="relayStoryInput" placeholder="物語の始まりを書いてください..." rows="3"
                            maxlength="500"></textarea>
                        <div class="relay-input-footer">
                            <span class="char-counter" id="relayInputCount">0 / 500</span>
                            <button id="relaySubmitBtn" class="primary-btn">AIへ渡す</button>
                        </div>
                    </div>
                </div>

                <!-- 3. 完結画面 -->
                <div id="relayFinishView" class="relay-panel hidden">
                    <div class="relay-finish-header">
                        <span class="relay-finish-icon">🎉</span>
                        <h1>物語が完結しました！</h1>
                        <p>10ターンのリレーを完走しました。完成した物語を振り返ってみましょう。</p>
                    </div>

                    <div class="relay-full-story" id="relayFullStory">
                        <!-- 完成した物語の全文 -->
                    </div>

                    <div class="relay-finish-actions">
                        <button id="relayCopyBtn" class="primary-btn">全文をコピー</button>
                        <button id="relayRestartBtn" class="relay-btn-secondary">新しい物語を始める</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- テーマ切り替え -->
        <div class="theme-toggle-container">
            <div class="theme-toggle">
                <label class="theme-option">
                    <input type="radio" name="theme" value="light">
                    <span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        ライト
                    </span>
                </label>
                <label class="theme-option">
                    <input type="radio" name="theme" value="system" checked>
                    <span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a10 10 0 0 1 0 20Z" fill="currentColor"></path>
                        </svg>
                        システム
                    </span>
                </label>
                <label class="theme-option">
                    <input type="radio" name="theme" value="dark">
                    <span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        ダーク
                    </span>
                </label>
            </div>
        </div>
    </div>

    <!-- 設定フローティングボタン -->
    <button id="settingsToggle" class="settings-fab" aria-label="設定を開く">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
        </svg>
    </button>

    <!-- 設定パネル -->
    <div id="settingsPanel" class="settings-panel" aria-hidden="true">
        <div class="settings-panel-header">
            <span>設定</span>
            <button id="settingsClose" class="settings-close-btn" aria-label="設定を閉じる">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
        <div class="settings-panel-body">
            <div class="mode-select-container">
                <label><input type="checkbox" id="choiceOnly"> 選択肢のみ</label>
            </div>
            <div class="custom-word-container">
                <label><input type="checkbox" id="customWordMode"> ワード指定</label>
                <input type="text" id="customWordInput" placeholder="単語・最大10文字" maxlength="10" disabled>
            </div>
            <div class="model-select-container">
                <label id="modelSelectLabel" for="customSelectTrigger">モデルを選択:</label>
                <div class="custom-select-wrapper" id="customSelectWrapper">
                    <select id="modelSelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
                        <option value="" disabled selected>モデル読み込み中...</option>
                    </select>
                    <button type="button" id="customSelectTrigger" class="custom-select-trigger" aria-haspopup="listbox"
                        aria-expanded="false" aria-labelledby="modelSelectLabel customSelectValue">
                        <span id="customSelectValue" class="custom-select-value">モデル読み込み中...</span>
                        <svg class="custom-select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div id="customSelectDropdown" class="custom-select-dropdown" role="listbox"
                        aria-labelledby="modelSelectLabel" tabindex="-1">
                        <!-- JSで動的にオプションを生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 生成中モーダル -->
    <div id="loadingModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="spinner"></div>
            <p>お題を生成中...</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
